{{ define "main" }}
<main class="container section animate-fade-in">
    <nav class="mb-6">
        <a href="/blog/" class="btn btn-secondary">&larr; Blog</a>
    </nav>

    <header class="mb-8">
        <h1 class="text-3xl font-bold mb-2 text-primary">Browse by Day</h1>
        <p class="text-muted mb-4">{{ len .Data.Terms }} days with posts</p>
    </header>

    <section class="card surface-primary max-h-96 overflow-y-auto space-y-2">
        {{ range .Data.Terms.Alphabetical.Reverse }}
        <div class="flex justify-between items-center border-b last:border-b-0 py-3">
            <div>
                <a href="{{ .Page.RelPermalink }}" class="text-primary hover:underline font-medium">
                    {{ .Page.Date.Format "02. January 2006" }}
                </a>
                <div class="text-muted text-sm">
                    <a href='/blog/{{ .Page.Date.Format "2006/01" }}/' class="hover:underline">
                        {{ .Page.Date.Format "01/2006" }}
                    </a>
                </div>
            </div>
            <span class="badge badge-primary">
                {{ .Count }} {{ cond (eq .Count 1) "post" "posts" }}
            </span>
        </div>
        {{ end }}
    </section>
</main>
{{ end }}
