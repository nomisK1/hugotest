backend:
  name: git-gateway
  repo: nomisK1/hugotest
  branch: master

site_url: https://hugotestin.netlify.app/
display_url: https://hugotestin.netlify.app/

media_folder: static/media
public_folder: /media

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Post"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "posts/{{year}}/{{month}}/{{day}}/{{slug}}"
    filter: { field: "layout", value: "single" }
    fields:
      - {
          label: "Featured Image",
          name: "thumbnail",
          widget: "image",
          max_file_size: 5242880,
          required: false,
        } # 5MB
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string", required: false }
      - {
          label: "Description",
          name: "description",
          widget: "string",
          required: false,
        }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          default: "{{now}}",
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Tags", name: "tags", widget: "list", default: ["new"] }
      - {
          label: "Categories",
          name: "categories",
          widget: "list",
          default: ["general"],
        }
      - { label: "Type", name: "type", widget: "hidden", default: "blog" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Body", name: "body", widget: "markdown" }

commit_messages:
  create: "post: create {{collection}} -> {{slug}}"
  update: "post: update {{collection}} -> {{slug}}"
  delete: "post: delete {{collection}} -> {{slug}}"
  uploadMedia: "media: upload {{path}}"
  deleteMedia: "media: delete {{path}}"
