backend:
  name: git-gateway
  repo: nomisK1/hugotest
  branch: master
  commit_messages:
    create: "Post: Create {{collection}} {{slug}}"
    update: "Post: Update {{collection}} {{slug}}"
    delete: "Post: Delete {{collection}} {{slug}}"
    uploadMedia: "Media: Upload {{path}}"
    deleteMedia: "Media: Delete {{path}}"
    openAuthoring: "{{message}}"

site_url: https://hugotestin.netlify.app/
display_url: https://hugotestin.netlify.app/

media_folder: static/media
public_folder: /media

logo_url: /svg/logo.svg
publish_mode: simple

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    path: "posts/{{year}}/{{month}}/{{day}}/{{slug}}/{{slug}}"
    filter: { field: "layout", value: "single" }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string", required: false }
      - {
          label: "Description",
          name: "description",
          widget: "string",
          required: false,
        }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          default: "{{now}}",
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Tags", name: "tags", widget: "list", default: ["new"] }
      - {
          label: "Categories",
          name: "categories",
          widget: "list",
          default: ["general"],
        }
      - { label: "Type", name: "type", widget: "hidden", default: "blog" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Body", name: "body", widget: "markdown" }
      - {
          label: "Featured Image",
          name: "thumbnail",
          widget: "image",
          max_file_size: 5242880,
          required: false,
        } # 5MB
