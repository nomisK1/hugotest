backend:
  name: git-gateway
  repo: nomisK1/hugotest
  branch: master
  commit_messages:
    create: "Blog: Create {{collection}} {{slug}}"
    update: "Blog: Update {{collection}} {{slug}}"
    delete: "Blog: Delete {{collection}} {{slug}}"
    uploadMedia: "Media: Upload {{path}}"
    deleteMedia: "Media: Delete {{path}}"
    openAuthoring: "{{message}}"

site_url: https://hugotestin.netlify.app/
display_url: https://hugotestin.netlify.app/

media_folder: static/media
public_folder: /media

logo_url: /svg/logo.svg
publish_mode: simple

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    slug: "{{slug}}"
    path: "{{year}}/{{month}}/{{day}}/{{slug}}/index"
    filter: { field: layout, value: single }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Type, name: type, widget: hidden, default: blog }
      - { label: Layout, name: layout, widget: hidden, default: single }
      - { label: Date, name: date, widget: datetime, default: "{{now}}" }
      - { label: Year, name: years, widget: hidden, default }
      - { label: Month, name: months, widget: hidden, default }
      - { label: Day, name: days, widget: hidden, default }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - {
          label: Author,
          name: author,
          widget: string,
          default,
          required: false,
        }
      - {
          label: Description,
          name: description,
          widget: string,
          default,
          required: false,
        }
      - { label: Categories, name: categories, widget: list, default: [] }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Body, name: body, widget: markdown }
      - {
          label: Featured Image,
          name: thumbnail,
          widget: image,
          max_file_size: 5242880,
          required: false,
        }
