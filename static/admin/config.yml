backend:
  name: git-gateway
  repo: nomisK1/hugotest
  branch: master

site_url: https://hugotestin.netlify.app/
display_url: https://hugotestin.netlify.app/

media_folder: static/media
public_folder: /media

collections:
  - name: "posts"
    label: "Blog"
    label_singular: "Post"
    folder: "content/_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{year}}/{{slug}}"
    filter: { field: "type", value: "post" }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Description",
          name: "description",
          widget: "string",
          required: false,
        }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          default: "{{now}}",
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["new"] }
      - {
          label: "Categories",
          name: "categories",
          widget: "list",
          default: ["general"],
        }
      - { label: "Type", name: "type", widget: "hidden", default: "blog" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Body", name: "body", widget: "markdown" }
